# ==========================
# 基本設定
# ==========================

# プレフィックスキーを Ctrl-a に変更（デフォルトは Ctrl-b）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 256色 + True Color対応（iTerm2推奨）
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# 履歴量アップ
set -g history-limit 100000

# マウス操作有効化（クリックでペイン切替、ドラッグでコピー）
set -g mouse on

# クリップボード連携（tmux 3.2+）
set -g set-clipboard on

# ウィンドウ番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ==========================
# ペイン・ウィンドウ操作
# ==========================

# 画面分割（カレントディレクトリ維持）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ペイン移動（Ctrl + h/j/k/l）
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ペインリサイズ（Prefix + Shift + 矢印）
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

# ウィンドウ移動（Shift + ← / →）
bind -n S-Left  previous-window
bind -n S-Right next-window

# ==========================
# ステータスバー（通常モード用）
# ==========================

# 統合モード（tmux -CC）では無効
set -g status-bg colour236
set -g status-fg white

# 左側: セッション名
set -g status-left-length 30
set -g status-left '#[fg=green]#S #[fg=white]'

# 右側: 日付と時刻
set -g status-right-length 50
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M:%S '

# 更新間隔
set -g status-interval 1

# ==========================
# コピー・スクロール
# ==========================

# viキーバインド
setw -g mode-keys vi

# viモードでのコピー
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# WheelUpで履歴（copy-mode）に自動突入、WheelDownは通常動作
bind -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"
bind -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"

# ==========================
# プラグイン管理（TPM）
# ==========================

# TPMの読み込み
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'          # macOSクリップボード対応
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # セッション復元
# set -g @plugin 'tmux-plugins/tmux-continuum'   # 自動復元
# set -g @continuum-restore 'on'

# TPM初期化
run '~/.tmux/plugins/tpm/tpm'

