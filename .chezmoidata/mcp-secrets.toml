# MCPサーバーへ渡す認証情報の 1Password パス。
# アカウントは .chezmoi.toml.tmpl の personalOnepasswordAccount を使う。
[mcpSecrets]
    socialdataApiKey = "op://Personal/SocialData/api_key"
    xClientId        = "op://Personal/X Developer Client Secret/username"
    xClientSecret    = "op://Personal/X Developer Client Secret/password"
