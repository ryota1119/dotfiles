[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultctl"
version = "0.1.0"
description = "exocortex vault の整合性管理 CLI"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
vaultctl = "vaultctl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/vaultctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
